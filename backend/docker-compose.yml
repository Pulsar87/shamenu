services:
  postgres:
    image: postgres:16-alpine
    container_name: menu_app_postgres
    environment:
      POSTGRES_USER: menu_app
      POSTGRES_PASSWORD: menu_app_password
      POSTGRES_DB: menu_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menu_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: menu_app_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DATABASE_URL=postgresql://menu_app:menu_app_password@postgres:5432/menu_app
    container_name: menu_app_backend
    environment:
      DATABASE_URL: postgresql://menu_app:menu_app_password@postgres:5432/menu_app
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-in-production}
      PORT: 3001
      HOST: 0.0.0.0
      CORS_ORIGIN: "*"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      LOG_LEVEL: info
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "npm run db:generate &&
             npm run db:migrate &&
             npm run db:seed &&
             npm start"

  caddy:
    image: caddy:2-alpine
    container_name: menu_app_caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  default:
    name: menu_app_network
